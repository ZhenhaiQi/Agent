spring.application.name=agent

# ===== Spring AI / DeepSeek =====
# API Key 从环境变量读取，切勿硬编码。运行前执行：export DEEPSEEK_API_KEY=sk-xxxx
spring.ai.openai.api-key=${DEEPSEEK_API_KEY}
# Spring AI 2.0 基于官方 OpenAI Java SDK，其默认 base-url 含 /v1，请求再拼 /chat/completions
spring.ai.openai.base-url=https://api.deepseek.com/v1
# 注意：2.0 起是 chat.model，旧的 chat.options.model 已废弃
spring.ai.openai.chat.model=deepseek-chat

# 只启用 chat，关闭用不到的模型，避免启动时创建无用 Bean
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# 不把堆栈泄露给调用方（容器级错误；业务异常走 GlobalExceptionHandler）
server.error.include-stacktrace=never
